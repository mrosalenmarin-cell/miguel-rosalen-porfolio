<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="author" content="Miguel Rosalén">
<title>JUEGOS · MIGUEL ROSALÉN</title>

<link rel="preload" as="image" href="assets/multiverse/hub-read.webp?v=read-me-game-v2" fetchpriority="high">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow:hidden}
button{font:inherit}
body{
  min-height:100dvh;
  color:#fff;
  background:#df4c35;
  font-family:"Courier New",monospace;
  animation:juegoFondoEspectral 18s ease-in-out infinite;
}
@keyframes juegoFondoEspectral{
  0%{background-color:#e24735}14%{background-color:#ef8a35}
  28%{background-color:#e4c53d}42%{background-color:#63b970}
  56%{background-color:#3bb6ad}70%{background-color:#4f8ed0}
  84%{background-color:#8c68c4}100%{background-color:#d55391}
}

.juegos-hub{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  overflow:hidden;
  padding:clamp(12px,2.3vw,28px);
}
.juegos-hub::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  opacity:0;transition:opacity .3s ease;
}
body.fx-ready .juegos-hub::before{
  opacity:.82;
  background:transparent url("assets/multiverse/hub-glitter.gif") 0 0/192px 192px repeat;
  mix-blend-mode:screen;
  image-rendering:pixelated;
}
.juegos-hub>*{position:relative;z-index:1}

.juegos-hub-cabecera{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  margin-bottom:clamp(10px,1.5vw,18px);
  padding-bottom:9px;
  border-bottom:2px solid rgba(255,255,255,.72);
}
.juegos-hub-cabecera h1{
  margin:0;
  font:900 clamp(25px,3.6vw,48px)/1 "Arial Black",Arial,sans-serif;
  text-shadow:0 2px 0 rgba(20,35,70,.38);
}
.juegos-hub-cabecera p{
  max-width:560px;margin:14px 0 0;text-align:left;
  font:700 11px/1.35 "Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive;
  opacity:.92;
}
.volver-web{
  flex:0 0 auto;
  border:2px solid rgba(255,255,255,.85);
  border-radius:999px;
  padding:8px 11px;
  color:#fff;background:rgba(30,30,70,.12);
  text-decoration:none;
  font:700 9px/1 "Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive;
}

.juegos-red{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  grid-template-rows:minmax(0,1fr);
  min-height:0;
  gap:clamp(8px,1.15vw,16px);
}

.juego-tarjeta{
  min-width:0;min-height:0;padding:0;
  display:grid;grid-template-rows:minmax(0,1fr) auto;
  overflow:hidden;
  border:3px solid rgba(255,255,255,.92);
  border-radius:12px;
  background:#fff;
  box-shadow:0 6px 0 rgba(35,27,83,.38),0 12px 24px rgba(19,24,70,.2);
  cursor:pointer;
  transition:transform .16s ease,filter .16s ease;
}
.juego-tarjeta:hover,.juego-tarjeta:focus-visible{
  transform:translateY(-4px);
  filter:brightness(1.04) saturate(1.08);
  outline:3px solid #ffe35b;
  outline-offset:2px;
}
.juego-tarjeta>img{
  display:block;width:100%;height:100%;min-height:0;
  object-fit:contain;object-position:center;background:#dbeefa;
}
.juego-tarjeta:nth-child(1)>img{object-position:62% center}
.juego-tarjeta:nth-child(4)>img{object-position:20% center}
.juego-tarjeta:nth-child(5)>img{object-fit:cover;object-position:center}

.juego-tarjeta-texto{
  display:block;margin:0;padding:10px 9px 11px;
  color:#16223d;background:rgba(255,255,255,.98);text-align:center;
}
.juego-tarjeta-texto strong{
  display:block;
  font:900 clamp(13px,1.25vw,20px)/1 "Arial Black",Arial,sans-serif;
}
.juego-tarjeta-texto small{
  display:block;margin-top:5px;color:#526079;
  font:700 clamp(8px,.72vw,10px)/1.15 "Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive;
}

@media (min-width:761px) and (max-width:1100px){
  .juegos-hub{overflow:auto}
  .juegos-red{
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(250px,1fr));
    align-content:start;gap:10px;
  }
  .juego-tarjeta{min-height:250px}
  .juego-tarjeta:last-child{grid-column:2}
}

@media (max-width:760px) and (orientation:portrait){
  body,.juegos-hub,.juegos-hub *{
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive;
  }
  .juegos-hub{padding:10px;grid-template-rows:auto minmax(0,1fr)}
  .juegos-hub-cabecera{align-items:flex-start;margin-bottom:8px}
  .juegos-hub-cabecera h1{font-size:27px}
  .juegos-hub-cabecera p{font-size:9px}
  .volver-web{padding:7px 9px;font-size:8px}
  .juegos-red{
    display:flex;flex-flow:row nowrap;
    align-items:stretch;justify-content:flex-start;
    width:100%;height:100%;min-height:0;
    overflow-x:auto;overflow-y:hidden;
    padding:4px 7vw 15px;gap:12px;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
  }
  .juego-tarjeta{
    flex:0 0 82vw;width:82vw;min-width:82vw;height:100%;
    scroll-snap-align:center;scroll-snap-stop:always;
  }
  .juego-tarjeta-texto{padding:6px}
  .juego-tarjeta-texto strong{font-size:12px}
  .juego-tarjeta-texto small{font-size:7px;margin-top:3px}
}

@media (orientation:landscape) and (max-height:560px) and (pointer:coarse){
  body,.juegos-hub,.juegos-hub *{
    font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive;
  }
  .juegos-hub{padding:7px 9px 8px;grid-template-rows:auto minmax(0,1fr)}
  .juegos-hub-cabecera{margin-bottom:5px;padding-bottom:5px}
  .juegos-hub-cabecera h1{font-size:21px;line-height:1}
  .juegos-hub-cabecera p{margin-top:3px;max-width:none;font-size:7px;line-height:1.15}
  .volver-web{padding:6px 8px;font-size:7px}
  .juegos-red{
    display:flex;flex-flow:row nowrap;
    align-items:center;justify-content:flex-start;
    width:100%;height:100%;min-height:0;
    padding:3px 8vw 8px;gap:11px;
    overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scroll-padding-inline:8vw;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
  }
  .juego-tarjeta{
    flex:0 0 auto;width:auto;height:calc(100% - 4px);
    aspect-ratio:3/4;
    scroll-snap-align:center;scroll-snap-stop:always;
  }
  .juego-tarjeta>img{
    width:100%;height:100%;
    object-fit:contain !important;
    object-position:center !important;
  }
  .juego-tarjeta-texto{padding:5px 6px 6px}
  .juego-tarjeta-texto strong{font-size:11px;line-height:1}
  .juego-tarjeta-texto small{margin-top:2px;font-size:6.5px;line-height:1.05}
}

@media (prefers-reduced-motion:reduce){
  body{animation:none}
  .juego-tarjeta{transition:none}
}
</style>
</head>

<body>
<main class="juegos-hub" id="juegosHub">
  <header class="juegos-hub-cabecera">
    <div>
      <h1>JUEGOS</h1>
      <p>elige entre estas cinco partidas pequeñas para perder el tiempo con toda la intención.</p>
    </div>
    <a class="volver-web" href="index.html">volver web</a>
  </header>

  <section class="juegos-red" id="juegosRed" aria-label="Selecciona un juego">
    
      <button class="juego-tarjeta" type="button" data-juego="READ ME">
        <img src="assets/multiverse/hub-read.webp?v=read-me-game-v2" alt=""
          loading="eager"
          fetchpriority="high"
          decoding="async">
        <span class="juego-tarjeta-texto">
          <strong>READ ME</strong>
          <small>Aparta la arena, encuentra el pergamino y léelo.</small>
        </span>
      </button>
      <button class="juego-tarjeta" type="button" data-juego="CURRICULUM">
        <img src="assets/multiverse/hub-curriculum.webp" alt=""
          loading="lazy"
          fetchpriority="low"
          decoding="async">
        <span class="juego-tarjeta-texto">
          <strong>CURRICULUM</strong>
          <small>Imprime el A4 y completa tres encargos en un minuto.</small>
        </span>
      </button>
      <button class="juego-tarjeta" type="button" data-juego="CONTACTO">
        <img src="assets/multiverse/hub-contacto.webp" alt=""
          loading="lazy"
          fetchpriority="low"
          decoding="async">
        <span class="juego-tarjeta-texto">
          <strong>CONTACTO</strong>
          <small>Tensa la pelota, suéltala y derriba los seis patos.</small>
        </span>
      </button>
      <button class="juego-tarjeta" type="button" data-juego="PORTFOLIO">
        <img src="assets/multiverse/hub-portfolio.webp" alt=""
          loading="lazy"
          fetchpriority="low"
          decoding="async">
        <span class="juego-tarjeta-texto">
          <strong>PORTFOLIO</strong>
          <small>Roba las obras cuando nadie esté mirando.</small>
        </span>
      </button>
      <button class="juego-tarjeta" type="button" data-juego="IA">
        <img src="assets/multiverse/hub-ia-custom.webp" alt=""
          loading="lazy"
          fetchpriority="low"
          decoding="async">
        <span class="juego-tarjeta-texto">
          <strong>IA</strong>
          <small>Responde al chat para construir y guardar tu avatar.</small>
        </span>
      </button>
  </section>
</main>

<script>
(() => {
  const ENGINE="juegos-engine.html";

  document.getElementById("juegosRed").addEventListener("click",event=>{
    const tarjeta=event.target.closest("[data-juego]");
    if(!tarjeta) return;
    event.preventDefault();
    location.href=ENGINE+"?juego="+encodeURIComponent(tarjeta.dataset.juego);
  });

  /* El glitter espera al primer render. */
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>document.body.classList.add("fx-ready"));
  });

  /* Precarga discreta del motor cuando el menú ya está pintado. */
  const prepararMotor=()=>{
    if(document.head.querySelector('link[data-engine-prefetch]')) return;
    const link=document.createElement("link");
    link.rel="prefetch";
    link.href=ENGINE;
    link.as="document";
    link.dataset.enginePrefetch="1";
    document.head.appendChild(link);
  };

  if("requestIdleCallback" in window){
    requestIdleCallback(prepararMotor,{timeout:2500});
  }else{
    setTimeout(prepararMotor,1400);
  }

  document.getElementById("juegosRed").addEventListener("pointerover",prepararMotor,{once:true,passive:true});
  document.getElementById("juegosRed").addEventListener("touchstart",prepararMotor,{once:true,passive:true});
})();
</script>
</body>
</html>
