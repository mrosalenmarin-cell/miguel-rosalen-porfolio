<script>
// Liquid ripple on scroll (directional triggers + progressive window degradation)
(function(){
   const root = document.documentElement || document.body;
   // only enable heavy SVG ripple on non-mobile devices
   if (false && !window.isMobileMode && window.innerWidth > 900) {
  root.style.filter = 'url(#ripple-filter)';
}

   const disp = document.getElementById('ripple-displacement');
   const noise = document.getElementById('ripple-noise');
   if(!disp || !noise) return;
   if(!root.style.filter) return;

   let lastY = window.scrollY || window.pageYOffset;
   let velocity = 0;
   let scale = 0;
   let currentDir = 0; // -1 up, 0 none, 1 down
   let lastTrigger = 0;
   const TRIGGER_COOLDOWN = 600; // ms

   function triggerWave(amount){
      velocity = Math.max(velocity, amount);
   }

   let scrollQueued = false;
   function onScroll(){
      if(document.body.classList.contains("ventana-max-activa")){
        lastY = window.scrollY || window.pageYOffset;
        return;
      }
      if(scrollQueued) return;
      scrollQueued = true;
      requestAnimationFrame(()=>{
        scrollQueued = false;
        const y = window.scrollY || window.pageYOffset;
        const dy = y - lastY;
        lastY = y;
        const newDir = dy > 4 ? 1 : (dy < -4 ? -1 : 0);
        const now = performance.now();
        if(newDir !== 0 && newDir !== currentDir && (now - lastTrigger) > TRIGGER_COOLDOWN){
           lastTrigger = now;
           triggerWave(18 + Math.random()*10);
        }
        currentDir = newDir;

        const depthFactor = Math.min(1, Math.abs(y) / 1200);
        const wins = document.querySelectorAll('.ventana');
        wins.forEach(win => {
          if(win.classList.contains("max")) return;
          const minOpacity = window.isMobileMode ? 0.5 : 0.15;
          const mult = window.isMobileMode ? 0.5 : 0.75;
          win.style.opacity = String(Math.max(minOpacity, 1 - depthFactor * mult));
          if(window.isMobileMode) return;
          const rect = win.getBoundingClientRect();
          if(rect.top < window.innerHeight && rect.bottom > 0){
            win.querySelectorAll('img').forEach(img => {
              img.style.opacity = String(Math.max(0.25, 1 - depthFactor));
            });
          }
        });
      });
   }

   window.addEventListener('scroll', onScroll, {passive:true});

   function animate(){
      if(!root.style.filter){ return; }
      velocity *= 0.86;
      scale = Math.min(36, velocity);
      disp.setAttribute('scale', String(scale));
      const bf = 0.008 + Math.min(0.025, scale * 0.0005) + (Math.sin(performance.now()/7000) * 0.0004);
      noise.setAttribute('baseFrequency', bf.toFixed(5));
      requestAnimationFrame(animate);
   }
   requestAnimationFrame(animate);
})();

  const mover=ev=>{
    const maxX=Math.max(0,limite.clientWidth-panel.offsetWidth);
    const maxY=limite===document.documentElement
      ? Math.max(0,document.documentElement.scrollHeight-panel.offsetHeight)
      : Math.max(0,limite.clientHeight-panel.offsetHeight);
    const x=Math.max(0,Math.min(maxX,inicio.left+ev.clientX-inicio.x));
    const y=Math.max(0,Math.min(maxY,inicio.top+ev.clientY-inicio.y));
    panel.style.left=x+"px";
    panel.style.top=y+"px";
    actualizarLineaNodoTactil();
    if(panel.classList.contains("ventana") && typeof asegurarLienzoMovil==="function") asegurarLienzoMovil(x,y,panel.offsetWidth,panel.offsetHeight);
  };
  const terminar=ev=>{
    panel.classList.remove("dragging");
    cabecera.releasePointerCapture?.(ev.pointerId);
    cabecera.removeEventListener("pointermove",mover);
    cabecera.removeEventListener("pointerup",terminar);
    cabecera.removeEventListener("pointercancel",terminar);
  };
  cabecera.addEventListener("pointermove",mover,{passive:false});
  cabecera.addEventListener("pointerup",terminar,{passive:true});
  cabecera.addEventListener("pointercancel",terminar,{passive:true});
},{capture:true,passive:false});
</script>

<script>
/* =========================================================
   MÓVIL HORIZONTAL — REAJUSTE AL GIRAR
   Impide que ventanas ya abiertas queden fuera del área visible.
   ========================================================= */
(function(){
  const mqLandscape=window.matchMedia(
    "(orientation: landscape) and (max-height: 560px) and (pointer: coarse)"
  );

  function numero(v){
    const n=parseFloat(v);
    return Number.isFinite(n)?n:0;
  }

  function limitarPanelEnPadre(panel,padre,margen=6){
    if(!panel || !padre) return;
    const maxX=Math.max(margen,padre.clientWidth-panel.offsetWidth-margen);
    const maxY=Math.max(margen,padre.clientHeight-panel.offsetHeight-margen);
    panel.style.left=Math.max(margen,Math.min(numero(panel.style.left)||panel.offsetLeft,maxX))+"px";
    panel.style.top=Math.max(margen,Math.min(numero(panel.style.top)||panel.offsetTop,maxY))+"px";
  }

  function ajustarHorizontal(){
    if(!mqLandscape.matches) return;

    /* Ventanas generales: mantenerlas dentro del viewport que el usuario ve. */
    const yBase=window.scrollY || document.documentElement.scrollTop || 0;
    const margenX=8;
    const margenArriba=48;
    const margenAbajo=8;

    document.querySelectorAll(".ventana:not(.max):not(.min)").forEach(v=>{
      if(v.offsetParent===null) return;

      const maxLeft=Math.max(margenX,window.innerWidth-v.offsetWidth-margenX);
      let left=numero(v.style.left);
      left=Math.max(margenX,Math.min(left,maxLeft));

      const minTop=yBase+margenArriba;
      const maxTop=Math.max(
        minTop,
        yBase+window.innerHeight-v.offsetHeight-margenAbajo
      );
      let top=numero(v.style.top);
      if(!top) top=minTop;
      top=Math.max(minTop,Math.min(top,maxTop));

      v.style.left=left+"px";
      v.style.top=top+"px";
    });

    /* Nodos principales e internos: recalcular dentro de su overlay. */
    document
      .querySelectorAll(
        ".portfolio-nodos-overlay .portfolio-nodo-ventana.is-open, "+
        ".portfolio-inline-nodos .portfolio-inline-nodo-ventana.is-open"
      )
      .forEach(panel=>{
        const padre=panel.parentElement;
        limitarPanelEnPadre(panel,padre,6);
      });
  }

  let raf=0;
  function programar(){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      requestAnimationFrame(ajustarHorizontal);
    });
  }

  window.addEventListener("orientationchange",()=>{
    setTimeout(programar,90);
    setTimeout(programar,260);
  },{passive:true});

  window.addEventListener("resize",programar,{passive:true});

  document.addEventListener("DOMContentLoaded",programar);
})();
</script>

<script>

(function instalarSwipeRapidoPortfolioMovil(){
  if(window.__portfolioSwipeRapidoV3) return;
  window.__portfolioSwipeRapidoV3=true;

  const esMovil=()=>matchMedia("(max-width:768px), (pointer:coarse)").matches;
  const esFilaValida=el=>{
    if(!el || !el.matches?.(".portfolio-folders:not(.portfolio-node-map)")) return false;
    const ventana=el.closest('.ventana[data-tipo="PORTFOLIO"]');
    if(!ventana || ventana.classList.contains("max") || ventana.classList.contains("min")) return false;
    const wrap=el.closest(".portfolio-wrap");
    return !!wrap && (wrap.dataset.mode==="home" || wrap.dataset.mode==="folders");
  };

  let gesto=null;
  let rafInercia=0;

  const pararInercia=()=>{
    if(rafInercia){
      cancelAnimationFrame(rafInercia);
      rafInercia=0;
    }
  };

  document.addEventListener("pointerdown",e=>{
    if(!esMovil() || e.pointerType==="mouse") return;

    const fila=e.target.closest?.(".portfolio-folders:not(.portfolio-node-map)");
    if(!esFilaValida(fila)) return;

    pararInercia();

    gesto={
      fila,
      pointerId:e.pointerId,
      x0:e.clientX,
      y0:e.clientY,
      xPrev:e.clientX,
      tPrev:performance.now(),
      scroll0:fila.scrollLeft,
      horizontal:false,
      movido:false,
      velocidad:0
    };
  },true);

  document.addEventListener("pointermove",e=>{
    if(!gesto || e.pointerId!==gesto.pointerId) return;

    const dx=e.clientX-gesto.x0;
    const dy=e.clientY-gesto.y0;

    if(!gesto.horizontal){
      if(Math.abs(dx)<6 && Math.abs(dy)<6) return;

      /* Solo tomamos el gesto si es claramente horizontal.
         Si es vertical, dejamos que la ventana haga su scroll normal. */
      if(Math.abs(dx) <= Math.abs(dy)*1.08){
        gesto=null;
        return;
      }

      gesto.horizontal=true;
      gesto.movido=true;
      gesto.fila.setPointerCapture?.(e.pointerId);
    }

    if(!gesto.horizontal) return;

    e.preventDefault();
    e.stopPropagation();

    const MULTIPLICADOR=2.55;
    gesto.fila.scrollLeft=gesto.scroll0-dx*MULTIPLICADOR;

    const ahora=performance.now();
    const dt=Math.max(8,ahora-gesto.tPrev);
    const deltaX=e.clientX-gesto.xPrev;

    /* px/ms de scroll, ya multiplicado */
    gesto.velocidad=(-deltaX*MULTIPLICADOR)/dt;
    gesto.xPrev=e.clientX;
    gesto.tPrev=ahora;
  },{capture:true,passive:false});

  const terminar=e=>{
    if(!gesto || (e.pointerId!=null && e.pointerId!==gesto.pointerId)) return;

    const actual=gesto;
    gesto=null;

    if(!actual.horizontal) return;

    try{ actual.fila.releasePointerCapture?.(actual.pointerId); }catch(_){}

    /* Evita abrir una carpeta accidentalmente después de un swipe. */
    actual.fila.dataset.swipeRapidoMovido="1";
    setTimeout(()=>{ delete actual.fila.dataset.swipeRapidoMovido; },120);

    let velocidad=actual.velocidad*16.67; // px/frame aprox.
    if(Math.abs(velocidad)<1.2) return;

    const paso=()=>{
      velocidad*=0.92;
      actual.fila.scrollLeft+=velocidad;

      if(Math.abs(velocidad)>0.55){
        rafInercia=requestAnimationFrame(paso);
      }else{
        rafInercia=0;
      }
    };
    rafInercia=requestAnimationFrame(paso);
  };

  document.addEventListener("pointerup",terminar,true);
  document.addEventListener("pointercancel",terminar,true);

  /* Si hubo swipe, anulamos únicamente el click accidental de esa carpeta. */
  document.addEventListener("click",e=>{
    const fila=e.target.closest?.(".portfolio-folders:not(.portfolio-node-map)");
    if(!fila || fila.dataset.swipeRapidoMovido!=="1") return;
    if(!fila.closest('.ventana[data-tipo="PORTFOLIO"]')) return;
    e.preventDefault();
    e.stopImmediatePropagation();
  },true);
})();

</script>




<script>
/* =========================================================
   INDEX · ARRANQUE SEGURO FINAL
   - Inicio siempre arriba
   - Una restauración del navegador NO cuenta como scroll humano
   - IA/interferencias solo reaccionan tras interacción real
   ========================================================= */
(()=>{
  if(window.__arranqueSeguroInstalado) return;
  window.__arranqueSeguroInstalado=true;

  try{
    if("scrollRestoration" in history){
      history.scrollRestoration="manual";
    }
  }catch(_){}

  let usuarioHaNavegado=false;
  let gestoHumano=false;
  let arranqueTerminado=false;

  const subirAlInicio=()=>{
    try{
      window.scrollTo(0,0);
      document.documentElement.scrollTop=0;
      if(document.body) document.body.scrollTop=0;
    }catch(_){}
  };

  const limpiarVentanasAutomaticasDeArranque=()=>{
    if(usuarioHaNavegado) return;

    /* Interferencias solo tienen sentido después de navegar. */
    document.querySelectorAll(".ventana-interferencia").forEach(v=>v.remove());

    /* Si la IA se abrió únicamente porque el navegador restauró
       una posición antigua, también la retiramos. */
    document.querySelectorAll(".ventana-ia").forEach(v=>{
      const out=v.querySelector(".ia-output");
      const contenido=(out?.textContent||"").toLowerCase();

      if(
        contenido.includes("scroll detectado") ||
        contenido.includes("sé que todavía estás ahí") ||
        contenido.includes("sigues dentro aunque no escribas") ||
        contenido.includes("tu dedo deja ruido")
      ){
        v.remove();
      }
    });
  };

  const estabilizarInicio=()=>{
    subirAlInicio();
    limpiarVentanasAutomaticasDeArranque();
  };

  /* Forzamos varias veces porque los navegadores pueden restaurar
     el scroll en momentos distintos del ciclo de carga. */
  estabilizarInicio();

  requestAnimationFrame(()=>{
    estabilizarInicio();

    requestAnimationFrame(()=>{
      estabilizarInicio();
    });
  });

  window.addEventListener("load",()=>{
    estabilizarInicio();

    setTimeout(estabilizarInicio,40);
    setTimeout(estabilizarInicio,160);
    setTimeout(()=>{
      estabilizarInicio();
      arranqueTerminado=true;
      document.documentElement.classList.remove("arranque-seguro");
    },320);
  },{once:true});

  /* BFCache / botones atrás y adelante. */
  window.addEventListener("pageshow",()=>{
    usuarioHaNavegado=false;
    gestoHumano=false;
    arranqueTerminado=false;

    document.documentElement.classList.add("arranque-seguro");

    estabilizarInicio();

    requestAnimationFrame(()=>{
      estabilizarInicio();

      requestAnimationFrame(()=>{
        estabilizarInicio();
        arranqueTerminado=true;
        document.documentElement.classList.remove("arranque-seguro");
      });
    });
  });

  /* ---------------------------------------------------------
     Detectar navegación HUMANA.
     --------------------------------------------------------- */

  const marcarGesto=()=>{
    if(!arranqueTerminado) return;
    gestoHumano=true;
  };

  window.addEventListener("wheel",marcarGesto,{passive:true});
  window.addEventListener("touchstart",marcarGesto,{passive:true});
  window.addEventListener("touchmove",marcarGesto,{passive:true});

  document.addEventListener("pointerdown",marcarGesto,{
    passive:true,
    capture:true
  });

  document.addEventListener("keydown",e=>{
    if(
      e.key==="ArrowDown" ||
      e.key==="ArrowUp" ||
      e.key==="PageDown" ||
      e.key==="PageUp" ||
      e.key==="Home" ||
      e.key==="End" ||
      e.key===" "
    ){
      marcarGesto();
    }
  },true);

  window.addEventListener("scroll",()=>{
    /* Un scroll disparado por restauración, scrollTo() o carga
       no desbloquea la IA. Tiene que venir precedido de gesto humano. */
    if(
      arranqueTerminado &&
      gestoHumano &&
      Math.abs(window.scrollY)>12
    ){
      usuarioHaNavegado=true;
    }
  },{passive:true});


  /* ---------------------------------------------------------
     PROTEGER IA AUTÓNOMA
     --------------------------------------------------------- */

  if(typeof window.hablarIAAlScrollear==="function"){
    const originalHablarIA=window.hablarIAAlScrollear;

    window.hablarIAAlScrollear=function(...args){
      if(!usuarioHaNavegado) return;
      return originalHablarIA.apply(this,args);
    };
  }


  /* ---------------------------------------------------------
     PROTEGER VENTANAS DE INTERFERENCIA
     --------------------------------------------------------- */

  if(typeof window.abrirInterferenciaIA==="function"){
    const originalInterferencia=window.abrirInterferenciaIA;

    window.abrirInterferenciaIA=function(...args){
      if(!usuarioHaNavegado) return;
      return originalInterferencia.apply(this,args);
    };
  }


  /* Si el navegador ya había restaurado la posición antes de
     ejecutar este script, corregimos cualquier efecto residual. */
  estabilizarInicio();

  /* Si por alguna razón load ya ocurrió antes de este script. */
  if(document.readyState==="complete"){
    setTimeout(()=>{
      estabilizarInicio();
      arranqueTerminado=true;
      document.documentElement.classList.remove("arranque-seguro");
    },80);
  }
})();
</script>
